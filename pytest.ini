[pytest]
asyncio_mode = auto

# Custom marks — prevents PytestUnknownMarkWarning
markers =
    eval: marks tests as LLM evaluation tests (deselected by default, run with --run-eval)

# Default: exclude eval tests unless --run-eval is passed.
# This goes in addopts so you never accidentally run LLM tests in CI.
addopts = -m "not eval"
