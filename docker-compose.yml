version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Use host networking so container traffic uses the host's network/VPN
    network_mode: "host"
    volumes:
      - ./data:/app/data
    env_file:
      - ${HOME}/.env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
